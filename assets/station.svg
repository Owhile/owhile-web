<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 800" preserveAspectRatio="none" role="img" aria-label="A train waiting at a platform at dusk, its windows lit with different worlds.">
<defs>
  <linearGradient id="carriage" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#1B2438"/><stop offset="18%" stop-color="#0D1421"/>
    <stop offset="100%" stop-color="#080D17"/>
  </linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%"   stop-color="#080D18"/>
    <stop offset="46%"  stop-color="#141E31"/>
    <stop offset="78%"  stop-color="#2A2F44"/>
    <stop offset="100%" stop-color="#4A4048"/>
  </linearGradient>
  <radialGradient id="horizon" cx="72%" cy="86%" r="60%">
    <stop offset="0%"   stop-color="#C98A55" stop-opacity=".38"/>
    <stop offset="100%" stop-color="#C98A55" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow">
    <stop offset="0%"   stop-color="#FFDCA8" stop-opacity=".8"/>
    <stop offset="40%"  stop-color="#FFC077" stop-opacity=".2"/>
    <stop offset="100%" stop-color="#FFB25E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="spill" cx="50%" cy="0%" r="65%">
    <stop offset="0%"   stop-color="#FFCB8E" stop-opacity=".16"/>
    <stop offset="100%" stop-color="#FFCB8E" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1440" height="800" fill="url(#sky)"/>
<rect width="1440" height="800" fill="url(#horizon)"/>

<!-- canopy: one clean silhouette, no clutter -->
<path d="M0 120h980l-64 26H0z" fill="#070B14"/>
<g fill="#070B14"><rect x="612" y="146" width="10" height="190"/><rect x="900" y="146" width="10" height="150"/></g>

<!-- warm practical lights: the only light source, so they must read -->
<g>
  <circle cx="617" cy="200" r="118" fill="url(#glow)"/><rect x="610" y="146" width="14" height="40" fill="#070B14"/><circle cx="617" cy="196" r="11" fill="#FFF2D8"/>
  <circle cx="905" cy="196" r="96" fill="url(#glow)" opacity=".7"/><rect x="898" y="146" width="14" height="36" fill="#070B14"/><circle cx="905" cy="192" r="9" fill="#FFF2D8"/>
</g>

<!-- THE TRAIN — §5: the train is Owhile, the windows are everything it contains -->
<g>
  <path d="M700 286h740v368H700a30 30 0 0 1-30-30V316a30 30 0 0 1 30-30z" fill="url(#carriage)"/>
  <path d="M700 286h740v5H700z" fill="#3A4A66" opacity=".7"/>
  <path d="M670 286h770v-11H670z" fill="#0A0F1A"/>
  <path d="M670 275h770v3H670z" fill="#2E3B54" opacity=".6"/>
  <path d="M700 286a30 30 0 0 0-30 30v308a30 30 0 0 0 30 30h16V286z" fill="#0C1320"/>
  <ellipse cx="690" cy="470" rx="110" ry="70" fill="url(#glow)"/>
  <circle cx="686" cy="470" r="8" fill="#FFF7E8"/>

  <!-- four worlds. §9: the shell stays calm, the content supplies the colour. -->
  <g>
    <rect x="800" y="330" width="170" height="176" rx="18" fill="#D4783F"/>
    <path d="M800 452c50-38 78-8 120-36 22-15 36-6 50-16v106H800z" fill="#7C3D1E" opacity=".5"/>
    <circle cx="922" cy="374" r="19" fill="#FFE0B0" opacity=".9"/>

    <rect x="1000" y="330" width="170" height="176" rx="18" fill="#4E9179"/>
    <path d="M1000 460c44-34 66-4 102-30 30-20 48-4 68-20v102h-170z" fill="#1F4636" opacity=".55"/>

    <rect x="1200" y="330" width="170" height="176" rx="18" fill="#43719F"/>
    <circle cx="1300" cy="378" r="26" fill="#CFE2F5" opacity=".35"/>
    <path d="M1200 474c56-50 90-6 122-32 22-19 34-11 48-22v92h-170z" fill="#1A3450" opacity=".55"/>
  </g>
  <g fill="none" stroke="#243149" stroke-width="5">
    <rect x="800" y="330" width="170" height="176" rx="18"/>
    <rect x="1000" y="330" width="170" height="176" rx="18"/>
    <rect x="1200" y="330" width="170" height="176" rx="18"/>
  </g>
  <path d="M982 286h10v368h-10zM1182 286h10v368h-10z" fill="#080D17" opacity=".85"/>
  <path d="M670 628h770v26H670z" fill="#070B12"/>
</g>

<ellipse cx="1085" cy="660" rx="400" ry="60" fill="url(#spill)"/>

<!-- platform -->
<path d="M0 654h1440v146H0z" fill="#05080F"/>
<rect y="654" width="1440" height="2" fill="#2B3648"/>
<rect y="668" width="1440" height="2" fill="#C9A96A" opacity=".45"/>
</svg>
